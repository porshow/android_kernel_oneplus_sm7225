name: Build Nord CE Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev clang llvm lld git gcc-aarch64-linux-gnu python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm7225 kernel-source

      - name: Prepare Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out vendor/lito-perf_defconfig
          make O=out olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 -j$(nproc)
